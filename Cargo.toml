[package]
name = "gixbi"
version = "0.1.0"
edition = "2024"
description = "Terminal graph of how chosen git branches interact"
repository = "https://github.com/Kuenlun/gixbi"
authors = ["Juan Luis Leal Contreras <kuenlunleal@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["git", "branch", "graph", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools", "visualization"]

[package.metadata.lockpick]
license-header = ".github/license_header.rs"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false
