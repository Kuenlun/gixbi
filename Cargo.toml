[package]
name = "gixbi"
version = "0.1.0"
edition = "2024"
description = "Terminal graph of how chosen git branches interact"
repository = "https://github.com/Kuenlun/gixbi"
authors = ["Juan Luis Leal Contreras <kuenlunleal@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["git", "branch", "graph", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools", "visualization"]

[package.metadata.lockpick]
license-header = ".github/license_header.rs"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false

[dependencies]
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "string", "wrap_help"] }
clap-cargo = { version = "0.18", default-features = false, features = ["clap"] }
clap_complete = "4"
git2 = { version = "0.21", default-features = false, optional = true }
gix = { version = "0.85", default-features = false, features = [
    "max-performance-safe",
    "sha1",
], optional = true }
thiserror = "2"

# Exactly one git backend is compiled in; `gix` wins when both are enabled
# (e.g. under --all-features) so the alternative can still be tested side
# by side. Build a git2-based binary with:
#   cargo build --no-default-features --features git2
[features]
default = ["gix"]
gix = ["dep:gix"]
git2 = ["dep:git2"]
